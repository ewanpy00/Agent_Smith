[project]
name = "agent-smith"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.3",
    "pydantic>=2.13.5",
    "pytest>=9.1.1",
]

[project.scripts]
sandbox = "agent_smith.sandbox.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent_smith", "agent_mbpp", "agent_swebench"]
only-include = ["agent_smith", "agent_mbpp", "agent_swebench", "models.py"]
